name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  g1:
    name: G1 - Gherkin and traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install syntax checker
        run: |
          python -m pip install --upgrade 'pip==26.2.2'
          python -m pip install '.[dev]'
      - name: Validate Gherkin, index and existing traceability
        run: |
          python .github/workflows/check-gherkin.py
          python -m tests.check_bindings
      - name: Record G1 result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '## G1 final\n- Result: %s\n- Tested SHA: %s\n- Human requirement approval: outside automated CI; not inferred from this result\n' "$RESULT" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve G1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-G1-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  checks:
    name: ${{ matrix.gate }}
    # Independent diagnostics do not override a failed/unverified G1.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gate: [G2, G3, G4, G5, G6]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      GATE: ${{ matrix.gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Record tested revision and environment
        run: |
          mkdir -p reports
          git rev-parse HEAD | tee reports/tested-commit.txt
          python --version | tee reports/python.txt
          uname -a | tee reports/os.txt
      - name: Install project and tools
        run: |
          python -m pip install --upgrade 'pip==26.2.2'
          python -m pip install '.[dev]'
          python -m pip check
          python -m pip freeze --all > reports/dependencies.txt
      - name: Install matching browser and system dependencies
        if: contains(fromJSON('["G2","G3","G6"]'), matrix.gate)
        run: python -m playwright install --with-deps chromium
      - name: Execute gate without suppressing failures
        run: |
          set +e
          (
            set -euo pipefail
            case "$GATE" in
              G2)
                python -m tests.check_bindings
                python -m pytest tests/bdd/ --junitxml=reports/G2.xml
                ;;
              G3)
                python -m pytest tests/regression/ --junitxml=reports/G3.xml
                ;;
              G4)
                python -m ruff check src tests
                python -m mypy src tests
                ;;
              G5)
                set +e
                python -m bandit -r src -f json -o reports/bandit.json
                bandit_status=$?
                python -m pip_audit --progress-spinner off -f json -o reports/pip-audit.json
                audit_status=$?
                set -e
                test "$bandit_status" -eq 0
                test "$audit_status" -eq 0
                ;;
              G6)
                python -m build --outdir "$RUNNER_TEMP/dist"
                python -m venv "$RUNNER_TEMP/wheel-check"
                wheel_python="$RUNNER_TEMP/wheel-check/bin/python"
                "$wheel_python" -m pip install --upgrade 'pip==26.2.2'
                "$wheel_python" -m pip install "$RUNNER_TEMP"/dist/*.whl 'httpx>=0.28,<1'
                (
                  cd "$RUNNER_TEMP"
                  "$wheel_python" - <<'PY'
          import secrets
          from importlib.resources import files
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from argon2 import PasswordHasher
          from starlette.testclient import TestClient
          from ai_bdd_demo.config import AppSettings
          from ai_bdd_demo.main import create_app
          package = files('ai_bdd_demo')
          for resource in ('templates/login.html', 'templates/welcome.html', 'static/style.css', 'static/login.js'):
              if not package.joinpath(resource).is_file():
                  raise RuntimeError(f'Missing packaged resource: {resource}')
          with TemporaryDirectory() as directory:
              settings = AppSettings(Path(directory) / 'wheel.sqlite3', secrets.token_urlsafe(32), False, 300, 'lax')
              app = create_app(settings=settings)
              with TestClient(app, follow_redirects=False) as client:
                  app.state.services.members.create('wheel-member', PasswordHasher().hash('wheel-only-password'))
                  response = client.get('/login')
                  assert response.status_code == 200 and 'name="username"' in response.text
                  for path in ('/static/style.css', '/static/login.js'):
                      assert client.get(path).status_code == 200
                  csrf = client.cookies.get('csrf_proof')
                  response = client.post('/login', data={'username': 'wheel-member', 'password': 'wheel-only-password', 'csrf_token': csrf})
                  assert response.status_code == 303
                  response = client.get('/welcome')
                  assert response.status_code == 200 and 'welcome-message' in response.text
          print('Installed wheel: application, login, welcome and resources verified outside repository')
          PY
                )
                python -m pytest tests/integration/ --junitxml=reports/G6.xml
                ;;
            esac
          ) > reports/gate.log 2>&1
          status=$?
          set -e
          cat reports/gate.log
          printf '%s\n' "$status" > reports/exit-code.txt
          exit "$status"
      - name: Record gate result and diagnostics
        if: always()
        env:
          RESULT: ${{ job.status }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          gate = os.environ['GATE']
          report = Path('reports') / f'{gate}.xml'
          exit_file = Path('reports/exit-code.txt')
          status = exit_file.read_text().strip() if exit_file.exists() else 'not executed'
          classification = 'See scanner/build/lint log'
          if status == 'not executed':
              classification = 'Environment/install failure, cancellation, or not executed; not PASS'
          elif status == '5':
              classification = 'Zero collected tests; not PASS'
          elif status == '2':
              classification = 'Interrupted/collection failure; not PASS'
          if report.exists():
              suites = list(ET.parse(report).getroot().iter('testsuite'))
              tests = sum(int(s.get('tests', 0)) for s in suites)
              failures = sum(int(s.get('failures', 0)) for s in suites)
              errors = sum(int(s.get('errors', 0)) for s in suites)
              classification = f'{tests} tests; {failures} failures; {errors} setup/collection errors; inspect tracebacks to assign ownership'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f"## {gate}\n- Job: {os.environ['RESULT']}\n- Exit: {status}\n- Tested SHA: {os.environ['GITHUB_SHA']}\n- PR head: {os.environ.get('PR_HEAD', '')}\n- {classification}\n- Deployment: not part of this workflow\n")
          PY
      - name: Preserve reports on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.gate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  # No SSH, deployment secrets or promotion artifact in this workflow.
  # deploy.yml retains G1-G6, verified artifact and production G7 prerequisites.
