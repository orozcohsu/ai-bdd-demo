[build-system]
requires = ["setuptools==84.2.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_bdd_demo = ["templates/*.html", "static/*.css", "static/*.js"]

[project]
name = "ai-bdd-demo"
version = "0.1.0"
description = "AI-BDD member login application"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.20,<1",
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
    # pytest-bdd 8.1.0 uses fixture internals removed in pytest 9.2.0.
    # Pin the pair verified by Runner instead of allowing incompatible upgrades.
    "pytest==9.1.1",
    "pytest-bdd==8.1.0",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "bandit[toml]>=1.8,<2",
    "pip-audit>=2.9,<3",
    "build>=1.2,<2",
    "playwright==1.64.0",
]

# G2／G3／G6：保留 pytest 零測試的失敗狀態。
# 不修改 pytest 的零測試退出狀態。
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
bdd_features_base_dir = "features"

# G4：檢查路徑於執行指令中指定。
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

# G5：
# Bandit 執行時指定實際程式路徑，不預設不存在的目錄。
# pip-audit 執行時掃描所選環境的相依套件。
# 本版未設定任何安全檢查排除或忽略規則。

# G1 人工核准與 G7 部署核准不屬於 Python 工具設定。
# 套件版本採相容範圍，本檔不是相依套件鎖定檔。
